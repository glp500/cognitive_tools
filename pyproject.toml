[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-tools"
version = "0.1.0"
description = "Adaptive social learning in renewable common-pool resource systems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "mesa==3.5.1",
    "pettingzoo==1.27.0",
    "gymnasium==1.3.0",
    "matplotlib==3.11.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.16.9"]

[project.scripts]
cognitive-experiment = "cognitive_tools.experiment:main"
cognitive-analysis = "cognitive_tools.analysis:main"

[tool.setuptools.packages.find]
include = ["cognitive_tools*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
